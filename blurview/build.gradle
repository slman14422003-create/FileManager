plugins {
    id 'com.android.library'
}

android {
    namespace = 'com.eightbitlab.blurview'
    compileSdk = 37

    defaultConfig {
        minSdk = 24
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError = false
    }
}

dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
}
